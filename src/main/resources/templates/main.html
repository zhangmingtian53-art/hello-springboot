<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>测试</title>
</head>
<body>
    <h1>测试</h1>

    <!-- 登录成功后后端会把 username 传回来，这里显示出来 -->
    <p th:if="${username}">
        登录成功，欢迎你，<span th:text="${username}"></span>！
    </p>
</body>
</html>
