<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Hello 测试表单</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; margin: 40px; }
        .box { width: 320px; margin: 0 auto; padding: 24px; border: 1px solid #ccc; border-radius: 8px; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Hello 测试表单</h2>
        <!-- method="get" 会把 input 的值拼到 URL：/hello?username=...&id=... -->
        <form action="/hello" method="get">
            <label>用户名：</label>
            <input type="text" name="username" placeholder="例如：dhy" required>

            <label>学号：</label>
            <input type="text" name="id" placeholder="例如：2411061207" required>

            <button type="submit">提交</button>
        </form>
    </div>
</body>
</html>
